<!-- Papan catur. Variabel: botName, modeLabel, statusLine, boardTitle, files[], rows[{rank, cells[]}], lastMoveLine, checkLine, capturedLine, help -->
<rich disclaimer="♟️ Catur · {{botName}}">
  <h2>♟️ Catur — {{modeLabel}}</h2>
  <p>{{statusLine}}</p>
  <table title="{{boardTitle}}">
    <tr><th> </th><for each="files" as="f"><th>{{f}}</th></for></tr>
    <for each="rows" as="r"><tr><td>{{r.rank}}</td><for each="r.cells" as="c"><td>{{c}}</td></for></tr></for>
  </table>
  <if test="lastMoveLine"><p>{{lastMoveLine}}</p></if>
  <if test="checkLine"><p><b>{{checkLine}}</b></p></if>
  <if test="capturedLine"><p>{{capturedLine}}</p></if>
  <if test="help"><p>Langkah: ketik <code>e2e4</code> atau <code>Nf3</code> (boleh pakai <code>.m e2e4</code>). Bantuan: <code>.catur help</code></p></if>
</rich>
